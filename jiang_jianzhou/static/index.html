<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江见舟 - 你的阳光元气少女</title>
<style>
:root {
  --bg: #0a0a18; --card: #12122a; --card2: #1a1a38;
  --purple: #8b5cf6; --pink: #f472b6; --sun: #fbbf24;
  --text: #e0dce8; --text2: #a09ab8; --border: #2a2a50;
  --accent: #c084fc; --user-bg: #5b21b6; --user-text: #ede9fe;
  --bubble-bg: #1e1e3a;
  /* 情绪光晕色 */
  --glow-calm: #8b5cf6;
  --glow-happy: #fbbf24;
  --glow-shy: #f9a8d4;
  --glow-angry: #ef4444;
  --glow-sad: #6366f1;
  --glow-surprised: #f97316;
  --glow-genki: #facc15;
  --glow-worry: #94a3b8;
  --glow-awkward: #a78bfa;
  --glow-cute: #f472b6;
  --glow-expect: #34d399;
  --glow-content: #a3e635;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; width: 100vw; overflow: hidden;
  display: flex; flex-direction: column;
}

/* ===== 顶部栏 ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px; background: var(--card);
  border-bottom: 1px solid var(--border);
  height: 48px; flex-shrink: 0; z-index: 20;
}
.topbar .logo {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--pink), var(--sun));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.topbar .subtitle { font-size: 12px; color: var(--text2); margin-left: 6px; }
.topbar .actions { display: flex; gap: 8px; }
.btn {
  padding: 6px 14px; border-radius: 16px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s; font-family: inherit;
}
.btn:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--accent); }
.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; box-shadow: 0 4px 15px rgba(139,92,246,0.3);
}
.btn-primary:hover { opacity: 0.92; }

/* ===== 主布局 ===== */
.main { display: flex; flex: 1; overflow: hidden; }

/* ===== 左侧角色展示区 (45%) ===== */
.char-panel {
  width: 45%; min-width: 380px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  background: var(--card); border-right: 1px solid var(--border);
  position: relative; overflow: hidden;
}
/* 背景光晕 */
.char-aura {
  position: absolute; width: 300px; height: 300px; border-radius: 50%;
  filter: blur(80px); opacity: 0.3;
  transition: background 0.8s, transform 0.8s;
  pointer-events: none; z-index: 0;
}
/* 浮动粒子 */
.char-particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.particle {
  position: absolute; font-size: 18px; opacity: 0;
  animation: particleDrift 4s ease-in-out infinite;
}
@keyframes particleDrift {
  0% { opacity:0; transform: translateY(0) translateX(0) scale(0); }
  20% { opacity:0.8; transform: translateY(-20px) scale(1); }
  80% { opacity:0.4; transform: translateY(-80px) scale(0.8); }
  100% { opacity:0; transform: translateY(-120px) scale(0); }
}

/* 角色容器 */
.char-stage {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; user-select: none;
}
.char-stage:active { transform: scale(0.97); }

/* 角色图片主体 */
.char-body {
  width: 260px; height: 260px;
  object-fit: cover;
  border-radius: 50%;
  transition: filter 0.5s, border-color 0.5s;
  position: relative; z-index: 2;
  /* 默认平静动画 */
  animation: anim-calm 3s ease-in-out infinite;
  filter: drop-shadow(0 0 30px var(--glow-calm));
}
/* 情绪专属动画 + 光晕 */
.char-body.calm  { animation: anim-calm 3s ease-in-out infinite; filter: drop-shadow(0 0 35px var(--glow-calm)); }
.char-body.happy { animation: anim-happy 0.6s ease-in-out infinite; filter: drop-shadow(0 0 45px var(--glow-happy)); }
.char-body.shy   { animation: anim-shy 1.8s ease-in-out infinite; filter: drop-shadow(0 0 30px var(--glow-shy)); }
.char-body.angry { animation: anim-angry 0.3s ease-in-out infinite; filter: drop-shadow(0 0 40px var(--glow-angry)); }
.char-body.sad   { animation: anim-sad 4s ease-in-out infinite; filter: drop-shadow(0 0 25px var(--glow-sad)); }
.char-body.surprised { animation: anim-surprised 0.8s ease-out infinite; filter: drop-shadow(0 0 50px var(--glow-surprised)); }
.char-body.genki  { animation: anim-genki 0.5s ease-in-out infinite; filter: drop-shadow(0 0 50px var(--glow-genki)); }
.char-body.worry  { animation: anim-worry 1s ease-in-out infinite; filter: drop-shadow(0 0 20px var(--glow-worry)); }
.char-body.awkward { animation: anim-awkward 1.2s ease-in-out infinite; filter: drop-shadow(0 0 25px var(--glow-awkward)); }
.char-body.cute   { animation: anim-cute 1s ease-in-out infinite; filter: drop-shadow(0 0 45px var(--glow-cute)); }
.char-body.expect { animation: anim-expect 0.9s ease-in-out infinite; filter: drop-shadow(0 0 40px var(--glow-expect)); }
.char-body.content { animation: anim-content 3s ease-in-out infinite; filter: drop-shadow(0 0 35px var(--glow-content)); }

/* === 12种情绪动画 === */
@keyframes anim-calm {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.02); }
}
@keyframes anim-happy {
  0%,100% { transform: translateY(0) scale(1); }
  25% { transform: translateY(-18px) scale(1.06); }
  50% { transform: translateY(0) scale(1); }
  75% { transform: translateY(-10px) scale(1.03); }
}
@keyframes anim-shy {
  0%,100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(-8px) rotate(-3deg); }
  75% { transform: translateX(8px) rotate(3deg); }
}
@keyframes anim-angry {
  0%,100% { transform: translateX(0); }
  15% { transform: translateX(-6px); }
  30% { transform: translateX(6px); }
  45% { transform: translateX(-4px); }
  60% { transform: translateX(4px); }
  75% { transform: translateX(-2px); }
}
@keyframes anim-sad {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(10px) scale(0.95); filter: drop-shadow(0 0 15px var(--glow-sad)); }
}
@keyframes anim-surprised {
  0% { transform: scale(1); }
  40% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes anim-genki {
  0% { transform: translateY(0) rotate(0); }
  15% { transform: translateY(-22px) rotate(-5deg); }
  30% { transform: translateY(0) rotate(0); }
  45% { transform: translateY(-14px) rotate(5deg); }
  60% { transform: translateY(0) rotate(0); }
  75% { transform: translateY(-8px) rotate(-3deg); }
  100% { transform: translateY(0) rotate(0); }
}
@keyframes anim-worry {
  0%,100% { transform: translateX(0); }
  33% { transform: translateX(-3px); }
  66% { transform: translateX(3px); }
}
@keyframes anim-awkward {
  0% { transform: rotate(0) translateY(0); }
  25% { transform: rotate(2deg) translateY(-3px); }
  50% { transform: rotate(-2deg) translateY(0); }
  75% { transform: rotate(1deg) translateY(-2px); }
  100% { transform: rotate(0) translateY(0); }
}
@keyframes anim-cute {
  0% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.05) rotate(-5deg); }
  60% { transform: scale(1.08) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes anim-expect {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-12px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes anim-content {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-3px) rotate(1deg); }
}

/* 情绪标签 */
.char-emotion-tag {
  margin-top: 16px; padding: 8px 22px; border-radius: 20px;
  background: var(--card2); border: 1px solid var(--border);
  font-size: 15px; color: var(--accent); z-index: 3;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.3s;
}
.char-emotion-tag .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--sun); animation: breathe 1.5s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity:0.4; transform:scale(0.8); } 50% { opacity:1; transform:scale(1.2); } }

/* 角色名字和信息 */
.char-name {
  font-size: 28px; font-weight: 700; color: var(--text);
  margin-top: 8px; z-index: 3;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.char-motto {
  font-size: 13px; color: var(--text2); z-index: 3;
  margin-top: 2px; font-style: italic;
}

/* 颜文字弹出 */
.kaomoji-pop-char {
  position: absolute; z-index: 10; pointer-events: none;
  font-size: 32px; font-weight: bold;
  animation: popChar 1.4s ease-out forwards;
  white-space: nowrap;
  top: 20%; left: 50%; transform: translateX(-50%);
}
@keyframes popChar {
  0% { opacity:1; transform: translateX(-50%) translateY(0) scale(0.3) rotate(-15deg); }
  30% { opacity:1; transform: translateX(-50%) translateY(-40px) scale(1.4) rotate(10deg); }
  100% { opacity:0; transform: translateX(-50%) translateY(-120px) scale(0.6) rotate(20deg); }
}

/* ===== 右侧对话区 (55%) ===== */
.chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 300px; }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 18px 24px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 5px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.msg-row { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.assistant { align-self: flex-start; }
.msg-row .msg-avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  object-fit: cover; cursor: pointer; transition: all 0.3s;
}
.msg-row.user .msg-avatar {
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; border: 2px solid var(--purple);
}
.msg-row.assistant .msg-avatar {
  border: 2px solid var(--pink);
}
.msg-row.assistant .msg-avatar:hover { transform: scale(1.15); }
.msg-row.assistant .msg-avatar.bounce { animation: avBounce 0.5s ease; }
@keyframes avBounce {
  0%,100%{transform:scale(1);} 30%{transform:scale(1.2);} 60%{transform:scale(0.9);}
}
.msg-bubble {
  padding: 10px 16px; border-radius: 18px;
  font-size: 14.5px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; position: relative;
}
.msg-row.user .msg-bubble {
  background: var(--user-bg); color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.msg-row.assistant .msg-bubble {
  background: var(--bubble-bg); color: var(--text);
  border: 1px solid var(--border); border-bottom-left-radius: 4px;
}
.msg-mood {
  font-size: 11px; color: var(--accent); margin-top: 3px;
  opacity: 0.8; padding-left: 4px;
}

/* 聊天区粒子 */
.kaomoji-particle {
  position: fixed; pointer-events: none; z-index: 200;
  font-size: 22px; font-weight: bold;
  animation: particleFloat 1.5s ease-out forwards;
  white-space: nowrap;
}
@keyframes particleFloat {
  0% { opacity:1; transform:translateY(0) scale(0.3) rotate(0deg); }
  25% { opacity:1; transform:translateY(-30px) scale(1.3) rotate(12deg); }
  60% { opacity:0.7; transform:translateY(-70px) scale(0.9) rotate(-8deg); }
  100% { opacity:0; transform:translateY(-130px) scale(0.4) rotate(10deg); }
}

/* 输入区 */
.chat-input-area {
  padding: 12px 24px 16px; border-top: 1px solid var(--border);
  background: var(--card); display: flex; gap: 8px; align-items: flex-end;
}
.chat-input-area textarea {
  flex: 1; resize: none; border-radius: 16px; padding: 11px 16px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-size: 14.5px; font-family: inherit;
  outline: none; min-height: 42px; max-height: 110px;
  transition: border-color 0.2s; line-height: 1.4;
}
.chat-input-area textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
.chat-input-area textarea::placeholder { color: var(--text2); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 15px rgba(139,92,246,0.25);
}
.send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 22px rgba(139,92,246,0.4); }
.send-btn:disabled { opacity:0.4; transform:none; cursor:not-allowed; box-shadow:none; }

/* 欢迎页 */
.welcome {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color: var(--text2); gap: 6px;
}
.welcome .w-icon { font-size: 60px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.welcome h2 { font-size: 22px; color: var(--text); margin-top:6px; }
.welcome p { font-size: 13px; max-width: 300px; line-height:1.8; }

.typing-dots { display: flex; gap: 4px; padding: 2px 4px; }
.typing-dots span { width:7px; height:7px; border-radius:50%; background:var(--text2); animation:dotBounce 1.4s infinite ease-in-out; }
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotBounce { 0%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-7px);} }

/* 设置弹窗 */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:300;
  display:flex; align-items:center; justify-content:center; backdrop-filter: blur(4px);
}
.modal {
  background: var(--card); border-radius: 20px;
  padding: 30px; width: 440px; max-width: 90vw; border: 1px solid var(--border);
}
.modal h2 { margin-bottom: 18px; font-size: 19px; color: var(--accent); }
.modal label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:12px; }
.modal input {
  width:100%; padding:9px 12px; border-radius:10px;
  background:var(--bg); border:1px solid var(--border);
  color:var(--text); font-size:13px; font-family:inherit; outline:none;
}
.modal input:focus { border-color: var(--purple); }
.modal .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
.hint { font-size:11px; color:var(--text2); margin-top:4px; }

@media (max-width: 768px) {
  .char-panel { display:none; }
  .msg-row { max-width:95%; }
  .chat-input-area { padding:10px 12px 14px; }
  .chat-messages { padding:14px 12px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;">
    <span class="logo">江见舟</span>
    <span class="subtitle">| 阳光元气少女 ☀️</span>
  </div>
  <div class="actions">
    <button class="btn btn-ghost" onclick="clearChat()">清空</button>
    <button class="btn btn-primary" onclick="openSettings()">API设置</button>
  </div>
</div>

<div class="main">
  <!-- ===== 左半边：动态角色展示 ===== -->
  <div class="char-panel" id="charPanel">
    <div class="char-aura" id="charAura"></div>
    <div class="char-particles" id="charParticles"></div>

    <div class="char-stage" id="charStage" onclick="pokeChar()">
      <img class="char-body calm" id="charBody" src="/static/emotions/00.png" alt="江见舟">
      <div class="char-emotion-tag" id="charEmotionTag">
        <span class="dot"></span>
        <span id="charKaomoji">(。-ω-)zzz</span>
        <span id="charEmotionName">平静</span>
      </div>
    </div>
    <div class="char-name">江见舟</div>
    <div class="char-motto">"每一天都要元气满满呀 ✨"</div>
  </div>

  <!-- ===== 右半边：对话区 ===== -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcomeMsg">
        <div class="w-icon">☀️</div>
        <h2>嘿嘿，你来啦！</h2>
        <p>我是江见舟，叫我小江或者小舟都可以~<br>今天也要一起加油哦 (●'◡'●)ﾉ ✨</p>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea id="userInput" placeholder="和小江说点什么吧..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';"></textarea>
      <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="发送">➤</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal" style="display:none;">
  <div class="modal">
    <h2>API 设置</h2>
    <label>API Base URL</label>
    <input type="text" id="cfgBaseUrl" placeholder="https://api.openai.com/v1">
    <span class="hint">支持 OpenAI / DeepSeek / 豆包 等兼容接口</span>
    <label>API Key</label>
    <input type="password" id="cfgApiKey" placeholder="sk-...">
    <span class="hint">密钥仅保存在本地 config.json</span>
    <label>模型名称</label>
    <input type="text" id="cfgModel" placeholder="gpt-4o-mini">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 情绪定义 =====
const EMOTIONS = ['平静','开心','害羞','生气','伤心','惊讶','元气','担心','尴尬','卖萌','期待','满足'];
const EMOTION_CLASSES = ['calm','happy','shy','angry','sad','surprised','genki','worry','awkward','cute','expect','content'];
const EMOTION_GLOW = {
  calm: '#8b5cf6', happy: '#fbbf24', shy: '#f9a8d4', angry: '#ef4444',
  sad: '#6366f1', surprised: '#f97316', genki: '#facc15', worry: '#94a3b8',
  awkward: '#a78bfa', cute: '#f472b6', expect: '#34d399', content: '#a3e635'
};

const STATE = {
  messages: [],
  currentEmotion: '平静',
  currentEmotionIdx: 0,
  currentEmotionClass: 'calm',
  currentKaomoji: '(。-ω-)zzz',
  isStreaming: false,
};

// ===== 粒子系统 =====
const PARTICLE_SETS = {
  happy: ['✨','🌟','💫','🎉','💖'],
  genki: ['⚡','💪','🔥','✨','⭐'],
  shy: ['💕','🌸','💗','🎀'],
  cute: ['💝','🐱','✨','🎀','💖'],
  expect: ['✨','💫','🌟','🎯'],
  content: ['🌸','💚','🍀','☘️'],
  default: ['✨','💫','⭐','🌸'],
};

function spawnParticles() {
  const container = document.getElementById('charParticles');
  const set = PARTICLE_SETS[STATE.currentEmotionClass] || PARTICLE_SETS['default'];
  for (let i = 0; i < 4; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = set[Math.floor(Math.random() * set.length)];
    p.style.left = (20 + Math.random() * 60) + '%';
    p.style.top = (40 + Math.random() * 40) + '%';
    p.style.animationDuration = (3 + Math.random() * 5) + 's';
    p.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}
setInterval(spawnParticles, 3000);
spawnParticles();

// ===== 情绪切换 =====
function setEmotion(name, idx, kaomoji) {
  const prevIdx = STATE.currentEmotionIdx;
  STATE.currentEmotion = name;
  STATE.currentEmotionIdx = idx;
  STATE.currentEmotionClass = EMOTION_CLASSES[idx] || 'calm';
  STATE.currentKaomoji = kaomoji || '';

  const body = document.getElementById('charBody');
  // 切换图片
  body.src = `/static/emotions/${String(idx).padStart(2,'0')}.png`;
  // 切换动画类
  body.className = 'char-body ' + STATE.currentEmotionClass;

  // 更新光晕色
  const aura = document.getElementById('charAura');
  aura.style.background = EMOTION_GLOW[STATE.currentEmotionClass] || '#8b5cf6';
  if (idx !== prevIdx) {
    aura.style.transform = 'scale(1.5)';
    setTimeout(() => { aura.style.transform = 'scale(1)'; }, 500);
  }

  // 更新文字
  document.getElementById('charEmotionName').textContent = name;
  document.getElementById('charKaomoji').textContent = kaomoji || '';

  // 弹出颜文字
  if (idx !== prevIdx && kaomoji) {
    popKaomojiOnChar(kaomoji);
  }
}

function popKaomojiOnChar(kaomoji) {
  const stage = document.getElementById('charStage');
  const el = document.createElement('div');
  el.className = 'kaomoji-pop-char';
  el.textContent = kaomoji;
  stage.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function pokeChar() {
  const body = document.getElementById('charBody');
  body.style.transform = 'scale(1.08)';
  setTimeout(() => { body.style.transform = ''; }, 150);

  const moods = ['(●\'◡\'●)ﾉ ✨','(/ω＼)','٩(ˊᗜˋ*)و','(★ ω ★)','(๑•̀ㅂ•́)و✧','(´▽`ʃ♡ƪ)','∑(°口°๑)'];
  popKaomojiOnChar(moods[Math.floor(Math.random() * moods.length)]);
}

// ===== 消息渲染 =====
function loadMessages() {
  try {
    const s = localStorage.getItem('xjz_messages');
    if (s) { STATE.messages = JSON.parse(s); renderAllMessages(); }
  } catch(e) {}
}
function saveMessages() {
  try { localStorage.setItem('xjz_messages', JSON.stringify(STATE.messages.slice(-60))); } catch(e) {}
}
function clearChat() {
  if (!confirm('确定清空所有对话吗？')) return;
  STATE.messages = [];
  saveMessages();
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatMessages').appendChild(createWelcomeEl());
  setEmotion('平静', 0, '(。-ω-)zzz');
}

function createWelcomeEl() {
  const d = document.createElement('div');
  d.className = 'welcome'; d.id = 'welcomeMsg';
  d.innerHTML = `<div class="w-icon">☀️</div><h2>嘿嘿，你来啦！</h2><p>我是江见舟，叫我小江或者小舟都可以~<br>今天也要一起加油哦 (●'◡'●)ﾉ ✨</p>`;
  return d;
}

function renderAllMessages() {
  const el = document.getElementById('chatMessages'); el.innerHTML = '';
  if (STATE.messages.length === 0) { el.appendChild(createWelcomeEl()); return; }
  STATE.messages.forEach(m => appendBubble(m.role, m.content, m.emotion, m.kaomoji, false));
  scrollBottom();
}

function appendBubble(role, content, emotion, kaomoji, animate = true) {
  const welcome = document.getElementById('welcomeMsg');
  if (welcome) welcome.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  if (animate) row.style.animation = 'fadeIn 0.35s ease';

  if (role === 'user') {
    row.innerHTML = `<div class="msg-avatar">😎</div><div><div class="msg-bubble">${esc(content)}</div></div>`;
  } else {
    const emoIdx = STATE.currentEmotionIdx;
    row.innerHTML = `<img class="msg-avatar" src="/static/emotions/${String(emoIdx).padStart(2,'0')}.png" alt=""
        onclick="pokeBubbleAvatar(this)"><div><div class="msg-bubble">${esc(content)}</div>
        ${emotion ? `<div class="msg-mood">${kaomoji||''} 小江${emotion}中</div>` : ''}</div>`;
  }
  document.getElementById('chatMessages').appendChild(row);
  scrollBottom();
}

function pokeBubbleAvatar(img) {
  img.classList.remove('bounce'); void img.offsetWidth; img.classList.add('bounce');
  const r = img.getBoundingClientRect();
  popParticle(r.left+r.width/2-20, r.top, STATE.currentKaomoji);
  pokeChar();
}

function popParticle(x, y, kaomoji) {
  const el = document.createElement('div');
  el.className = 'kaomoji-particle';
  el.textContent = kaomoji || '(●\'◡\'●)ﾉ';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function scrollBottom() {
  requestAnimationFrame(() => { const el = document.getElementById('chatMessages'); el.scrollTop = el.scrollHeight; });
}

// ===== 发送消息 =====
async function sendMessage() {
  if (STATE.isStreaming) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  STATE.isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  STATE.messages.push({ role: 'user', content: text });
  appendBubble('user', text);
  saveMessages();

  const typingRow = showTyping();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: STATE.messages })
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }

    typingRow.remove();
    const aiRow = createAiBubble();
    let full = '';
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6);
        if (d === '[DONE]') continue;
        try {
          const p = JSON.parse(d);
          if (p.delta) { full += p.delta; aiRow.querySelector('.msg-bubble').textContent = full; scrollBottom(); }
          if (p.emotion) {
            aiRow.querySelector('.msg-mood').textContent = `${p.kaomoji} 小江${p.emotion}中`;
            aiRow.querySelector('.msg-avatar').src = `/static/emotions/${String(p.emotion_idx).padStart(2,'0')}.png`;
            const prevIdx = STATE.currentEmotionIdx;
            setEmotion(p.emotion, p.emotion_idx, p.kaomoji);
            if (p.emotion_idx !== prevIdx) {
              const r = aiRow.querySelector('.msg-avatar').getBoundingClientRect();
              popParticle(r.left+r.width/2-20, r.top, p.kaomoji);
              aiRow.querySelector('.msg-avatar').classList.add('bounce');
            }
          }
          if (p.error) { aiRow.querySelector('.msg-bubble').textContent = '唔…出问题了：' + p.error; }
        } catch(e){}
      }
    }

    STATE.messages.push({
      role: 'assistant', content: full || '(咦…断线了 (。-ω-)zzz)',
      emotion: STATE.currentEmotion, kaomoji: STATE.currentKaomoji
    });
    saveMessages();
  } catch(e) {
    typingRow.remove();
    const er = document.createElement('div'); er.className = 'msg-row assistant';
    er.innerHTML = `<img class="msg-avatar" src="/static/emotions/00.png"><div><div class="msg-bubble">唔...连接失败了 (´；ω；\`) ${esc(e.message)}</div></div>`;
    document.getElementById('chatMessages').appendChild(er);
  }
  STATE.isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').focus();
}

function showTyping() {
  const row = document.createElement('div'); row.className = 'msg-row assistant'; row.id = 'typingRow';
  row.innerHTML = `<img class="msg-avatar" src="/static/emotions/00.png"><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  document.getElementById('chatMessages').appendChild(row); scrollBottom(); return row;
}

function createAiBubble() {
  const row = document.createElement('div'); row.className = 'msg-row assistant';
  row.innerHTML = `<img class="msg-avatar" src="/static/emotions/00.png" alt="" onclick="pokeBubbleAvatar(this)"><div><div class="msg-bubble"></div><div class="msg-mood"></div></div>`;
  document.getElementById('chatMessages').appendChild(row); scrollBottom(); return row;
}

// ===== 设置 =====
function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
async function saveSettings() {
  const body = {};
  const bu = document.getElementById('cfgBaseUrl').value.trim();
  const ak = document.getElementById('cfgApiKey').value.trim();
  const md = document.getElementById('cfgModel').value.trim();
  if (bu) body.base_url = bu;
  if (ak) body.api_key = ak;
  if (md) body.model = md;
  await fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  document.getElementById('cfgApiKey').value = '';
  document.getElementById('cfgApiKey').placeholder = '已设置 (留空不修改)';
  closeSettings();
}
document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target===this) closeSettings(); });

// 加载配置
async function loadConfig() {
  try {
    const r = await fetch('/api/config'); const cfg = await r.json();
    document.getElementById('cfgBaseUrl').value = cfg.base_url || 'https://api.openai.com/v1';
    document.getElementById('cfgModel').value = cfg.model || 'gpt-4o-mini';
    if (cfg.has_key) document.getElementById('cfgApiKey').placeholder = '已设置 (留空不修改)';
  } catch(e) {}
}

const animStyle = document.createElement('style');
animStyle.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}';
document.head.appendChild(animStyle);

loadConfig();
loadMessages();
</script>
