# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./attendance_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (for viewing in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application Configuration
app.attendance.auto-import=true
app.attendance.csv-file=出勤统计.csv
app.attendance.student-number=120231140328
app.attendance.student-name=学生

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.attendance=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
