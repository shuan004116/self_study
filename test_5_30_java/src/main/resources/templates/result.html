<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤查询结果</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 680px;
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        .info-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        .info-table td:first-child {
            color: #888;
            width: 100px;
            font-weight: bold;
        }
        .info-table td:last-child {
            color: #333;
        }
        .attendance-title {
            font-size: 16px;
            color: #555;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .attendance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 25px;
        }
        .att-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .att-item.present {
            background: #e8f8f0;
            color: #27ae60;
        }
        .att-item.absent {
            background: #fdf0ef;
            color: #e74c3c;
        }
        .att-item.leave {
            background: #fef9e7;
            color: #f39c12;
        }
        .att-date { font-weight: bold; }
        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: translateY(-2px); }
        .summary {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
        }
        .summary span { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📋 考勤查询结果</h1>

        <table class="info-table">
            <tr>
                <td>姓 名</td>
                <td th:text="${student.name}"></td>
            </tr>
            <tr>
                <td>学 号</td>
                <td th:text="${student.studentId}"></td>
            </tr>
            <tr>
                <td>专业班级</td>
                <td th:text="${student.majorClass}"></td>
            </tr>
        </table>

        <div class="attendance-title">📌 出勤详情</div>

        <div class="summary">
            共 <span th:text="${totalCount}"></span> 次记录
        </div>

        <div class="attendance-grid">
            <div th:each="record : ${records}">
                <div th:class="'att-item ' + ${record.statusClass}">
                    <span class="att-date" th:text="${record.date}"></span>
                    <span th:text="${record.status}"></span>
                </div>
            </div>
        </div>

        <a th:href="@{/}" class="back-btn">← 返回首页</a>
    </div>
</body>
</html>
